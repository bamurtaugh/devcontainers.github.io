# Site settings
title: Development containers
description: >
  Development containers documentation and specification page.

# Base URL configuration for Jekyll
# baseurl: / # the subpath of your site, e.g. /blog/
url: https://devcontainers.github.io # the base hostname & protocol for your site
git_address: https://github.com/devcontainers/devcontainers.github.io
git_edit_address: https://github.com/devcontainers/devcontainers.github.io/settings/pages/blob/gh-pages
theme_color: 2753E3 # Primary brand color used throughout the site

# Build settings
markdown: kramdown # Markdown processor
highlighter: rouge # Syntax highlighter for code blocks

# Jekyll plugins used for GitHub Pages
plugins:
  - github-pages   # GitHub Pages compatibility
  - jemoji         # Emoji support in markdown
  - jekyll-feed    # RSS feed generation


# Files and directories to exclude from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - .idea/
  - .gitignore
  - README.md
  - resources

# Site timezone for date/time formatting
timezone: Europe/Zurich

# Default values for different content types
defaults:
# Blog posts configuration
- scope:
    path: _posts
    type: posts
  values:
    layout: post
    sectionid: guide

# Documentation pages configuration
- scope:
    path: _docs
    type: docs
  values:
    layout: docs
    sectionid: docs
    seo:
      type: "WebPage"

# Implementors guide configuration
- scope:
    path: _implementors
    type: implementors
  values:
    layout: implementors
    sectionid: implementors

# Jekyll collections define custom content types beyond posts and pages
collections:
  docs:
    permalink: /:collection/:path/
    output: true
  posts:
    permalink: /guide/:title
    output: true
  implementors:
    permalink: /:collection/:path/
    output: true
